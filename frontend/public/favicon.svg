<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6d28d9" />
      <stop offset="50%" stop-color="#190a38" />
      <stop offset="100%" stop-color="#0d0620" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2c4" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bgGrad)" stroke="#00d2c4" stroke-width="12" />

  <!-- Outer Energy Ring Arc -->
  <path d="M 120,380 A 180,180 0 0,1 380,120" fill="none" stroke="url(#accentGrad)" stroke-width="16" stroke-linecap="round" stroke-dasharray="12 12" />

  <!-- Tilted Bodybuilding Dumbbell Group -->
  <g transform="translate(256, 256) rotate(-35) translate(-256, -256)" filter="url(#glow)">
    <!-- Central Chrome Bar -->
    <rect x="140" y="240" width="232" height="32" rx="16" fill="url(#plateGrad)" />

    <!-- Bar Grips -->
    <line x1="210" y1="240" x2="210" y2="272" stroke="#64748b" stroke-width="4" />
    <line x1="230" y1="240" x2="230" y2="272" stroke="#64748b" stroke-width="4" />
    <line x1="250" y1="240" x2="250" y2="272" stroke="#64748b" stroke-width="4" />
    <line x1="270" y1="240" x2="270" y2="272" stroke="#64748b" stroke-width="4" />
    <line x1="290" y1="240" x2="290" y2="272" stroke="#64748b" stroke-width="4" />

    <!-- Left Weight Plates (Outer to Inner) -->
    <rect x="90" y="176" width="28" height="160" rx="10" fill="url(#accentGrad)" />
    <rect x="122" y="196" width="26" height="120" rx="8" fill="url(#plateGrad)" />
    <rect x="150" y="216" width="18" height="80" rx="6" fill="#1e1b4b" stroke="#00d2c4" stroke-width="4" />

    <!-- Right Weight Plates (Inner to Outer) -->
    <rect x="344" y="216" width="18" height="80" rx="6" fill="#1e1b4b" stroke="#00d2c4" stroke-width="4" />
    <rect x="364" y="196" width="26" height="120" rx="8" fill="url(#plateGrad)" />
    <rect x="394" y="176" width="28" height="160" rx="10" fill="url(#accentGrad)" />

    <!-- End Caps -->
    <circle cx="82" cy="256" r="10" fill="#00d2c4" />
    <circle cx="430" cy="256" r="10" fill="#00d2c4" />
  </g>
</svg>
