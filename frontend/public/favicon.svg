<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="fitforge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Dark Container Pill -->
  <rect x="5" y="5" width="90" height="90" rx="28" fill="#0f172a" stroke="#1e293b" stroke-width="3" />

  <!-- Accent Glow Circle -->
  <circle cx="50" cy="50" r="32" fill="url(#fitforge-grad)" opacity="0.25" filter="url(#glow)" />

  <!-- Stylized Dumbbell Icon -->
  <g transform="translate(50, 50) rotate(-15) translate(-50, -50)">
    <!-- Central Bar -->
    <rect x="25" y="45" width="50" height="10" rx="5" fill="url(#fitforge-grad)" />

    <!-- Left Weight Plates -->
    <rect x="22" y="32" width="10" height="36" rx="4" fill="url(#fitforge-grad)" />
    <rect x="14" y="38" width="7" height="24" rx="3" fill="url(#fitforge-grad)" opacity="0.85" />

    <!-- Right Weight Plates -->
    <rect x="68" y="32" width="10" height="36" rx="4" fill="url(#fitforge-grad)" />
    <rect x="79" y="38" width="7" height="24" rx="3" fill="url(#fitforge-grad)" opacity="0.85" />

    <!-- Center Lightning/Power Spark -->
    <path d="M 48 30 L 42 49 L 51 49 L 45 70 L 58 47 L 49 47 Z" fill="#ffffff" filter="url(#glow)" />
  </g>
</svg>
